<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciarnuro Map</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/libs/three/build/three.module.js",
          "three/examples/jsm/": "./assets/libs/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- ═══════════════════════════════════════════════════
    CONSTELLATION UI
  ════════════════════════════════════════════════════════ -->
    <div id="constellation-ui">
      <!-- ═══════════════════════════════════════════════════
    Bottom HUD
  ════════════════════════════════════════════════════════ -->
      <div id="overlay">
        <div id="star-hint" class="hint hidden">
          Seleziona una stella da esplorare
        </div>
        <div id="no-system-hint" class="hint hidden">
          Sistema non ancora mappato
        </div>
        <button id="explore-btn" class="hidden">Esplora sistema</button>
        <div id="bottom-hint">
        </div>
        <div id="constellation-title"></div>
        <div id="click-hint" class="hint hidden">
          Clicca per esplorare la costellazione
        </div>
      </div>

      <button id="const-back-btn" class="hidden">
        <img src="./assets/img/back.png" alt="indietro" />
      </button>

      <!-- ═══════════════════════════════════════════════════
      Star Panel
    ════════════════════════════════════════════════════════ -->
    </div>

    <!-- ═══════════════════════════════════════════════════
   Solar System UI
  ════════════════════════════════════════════════════════ -->
    <div id="solar-ui" class="hidden">
      <button id="solar-back-btn" title="Torna alla costellazione">
        <img src="./assets/img/back.png" alt="indietro" />
      </button>
    </div>

    <!-- ═══════════════════════════════════════════════════
   Loading Screen
  ════════════════════════════════════════════════════════ -->
    <div id="loading">
      <div class="loading-inner">
        <div class="loading-dot"></div>
        <span>Caricamento atlante galattico…</span>
      </div>
    </div>

    <div id="scene-fade"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
